name: update data and deploy

on:
  workflow_dispatch:
    inputs:
      semester_year:
        description: "Crawling semester year"
        required: true
        default: ""   # keep static; resolve dynamically in steps
      semester_semester:
        description: "Crawling semester semester"
        required: true
        default: ""   # keep static; resolve dynamically in steps
  schedule:
    - cron: "0 8 * * *"
  push:
    branches:
      - 'standalone'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  update-course:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
        with:
          ref: standalone

      - name: Resolve semester inputs
        id: semester
        shell: bash
        run: |
          # Defaults (from repo file)
          default_semester="$(jq -r '.SEMESTER' ./semesterConfig.json)"
          default_year="$(jq -r '.YEAR' ./semesterConfig.json)"

          # Inputs override defaults if provided
          semester="${{ inputs.semester_semester || '' }}"
          year="${{ inputs.semester_year || '' }}"

          [[ -z "$semester" ]] && semester="$default_semester"
          [[ -z "$year" ]] && year="$default_year"

          echo "semester=$semester" >> "$GITHUB_OUTPUT"
          echo "year=$year" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: "Install crawler's dependencies"
        run: |
          pip install Scrapy
      
      - name: "Execute the crawler"
        working-directory: ./crawler
        run: |
          scrapy crawl courses -a year=${{steps.semester.outputs.year}} -a semester=${{steps.semester.outputs.semester}}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "Install the website's dependencies"
        run: |
          npm ci
          npm run build
          cp semesterList.json ./dist/course-data/semesterList.json
    
      - name: deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true
